[workspace]
members = [
    "softnpu",
    "scadm",
]
resolver = "2"

[workspace.dependencies]
p4rs = { git = "https://github.com/oxidecomputer/p4", branch = "main" }
p4-macro = { git = "https://github.com/oxidecomputer/p4", branch = "main" }
p4-test = { package = "tests", git = "https://github.com/oxidecomputer/p4", branch = "main" }
usdt = { git = "https://github.com/oxidecomputer/usdt" }

base64 = { version = "0.22" }
clap = { version = "4.6.1", features = ["derive", "unstable-styles"] }
anstyle = "1.0.14"
libc = "0.2"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
errno = "0.3"
num = { version = "0.4.3", features = ["num-bigint"] }
macaddr = { git = "https://github.com/luqmana/rust-macaddr", branch = "leading-zeros", version = "1.0.1" }
bitvec = "1.0"
colored = "3.1"
anyhow = "1"
pnet = "0.35"
pnet_macros = "0.35"
pnet_macros_support = "0.35"

# Use a forked p4 whose codegen drops the eager per-packet debug dumps
# (the SoftNPU throughput fix, ~186us -> ~26us/pkt). Applied as a [patch]
# override so the dependency tables keep pointing at upstream; drop this
# block once the change lands upstream.
[patch."https://github.com/oxidecomputer/p4"]
p4rs = { git = "https://github.com/matoushybl/p4", rev = "a6d9edbd7a46f609af9b09b6176588990fa0a8b2" }
p4-macro = { git = "https://github.com/matoushybl/p4", rev = "a6d9edbd7a46f609af9b09b6176588990fa0a8b2" }
p4-rust = { git = "https://github.com/matoushybl/p4", rev = "a6d9edbd7a46f609af9b09b6176588990fa0a8b2" }
tests = { git = "https://github.com/matoushybl/p4", rev = "a6d9edbd7a46f609af9b09b6176588990fa0a8b2" }
